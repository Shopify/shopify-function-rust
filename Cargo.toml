[workspace]
resolver = "2"
members = [
    "example_with_targets",
    "shopify_function",
    "shopify_function_macro",
    "integration_tests",
]

[workspace.package]
version = "2.2.0"

[workspace.dependencies]
shopify_function_macro = { version = "=2.2.0", path = "shopify_function_macro" }

[profile.release]
lto = true
opt-level = 'z'
strip = true

# Shopify/bluejay#149, which generates the variables structs, stacked on #148, which overrides input fields. Remove once both ship in a release.
[patch.crates-io]
bluejay-core = { git = "https://github.com/Shopify/bluejay", branch = "operation-variables" }
bluejay-parser = { git = "https://github.com/Shopify/bluejay", branch = "operation-variables" }
bluejay-typegen-codegen = { git = "https://github.com/Shopify/bluejay", branch = "operation-variables" }
bluejay-validator = { git = "https://github.com/Shopify/bluejay", branch = "operation-variables" }
